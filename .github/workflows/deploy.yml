name: Deploy to Production (adventure.madprotekcorp.com)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Next.js Application
        run: |
          export NEXT_DIST_DIR=".next_prod"
          npm run build
        env:
          NODE_ENV: production
          NEXT_TELEMETRY_DISABLED: 1

      - name: Deploy to Server via SSH
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SERVER_HOST || '209.42.28.163' }}
          username: 'madprote'
          password: ${{ secrets.SERVER_PASSWORD }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          source: ".next_prod,public,package.json,package-lock.json,next.config.js,server.js"
          target: "/home/madprote/adventure.madprotekcorp.com"
          strip_components: 0
          overwrite: true

      - name: Restart Application via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST || '209.42.28.163' }}
          username: 'madprote'
          password: ${{ secrets.SERVER_PASSWORD }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          debug: true
          script_stop: false
          script: |
            cd /home/madprote/adventure.madprotekcorp.com

            # Clean cache to prevent disk quota exceed
            rm -rf /home/madprote/.npm /home/madprote/.cache 2>/dev/null || true

            # Activate server Node.js 20 virtual environment
            if [ -f "/home/madprote/nodevenv/adventure.madprotekcorp.com/20/bin/activate" ]; then
              source /home/madprote/nodevenv/adventure.madprotekcorp.com/20/bin/activate
            fi

            echo "==> Server Node version: $(node -v 2>/dev/null || echo 'not found')"

            # Ensure .env.production is properly configured
            printf "%s\n" \
              "PORT=3000" \
              "NODE_ENV=production" \
              "MYSQL_HOST=localhost" \
              "MYSQL_PORT=3306" \
              "MYSQL_USER=madprote_mpuser" \
              "MYSQL_PASSWORD=MadProTekPass2026!#" \
              "MYSQL_DATABASE=madprote_offroad" \
              "ADMIN_SECRET_KEY=madprotek2026" \
              "NEXT_PUBLIC_APP_URL=https://adventure.madprotekcorp.com" \
              "NEXT_PUBLIC_CASHFREE_ENV=TEST" > .env.production

            # Trigger LiteSpeed / Passenger instant restart
            mkdir -p tmp && touch tmp/restart.txt
            pkill -f "lsnode.*adventure.madprotekcorp.com" 2>/dev/null || true

            echo "Deployment to adventure.madprotekcorp.com completed successfully!"
