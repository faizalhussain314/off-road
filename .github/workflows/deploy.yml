name: Deploy to Production (adventure.madprotekcorp.com)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Next.js Application
        run: npm run build
        env:
          NODE_ENV: production
          NEXT_TELEMETRY_DISABLED: 1

      - name: Deploy to Server via SSH
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          source: ".next,public,package.json,package-lock.json,ecosystem.config.cjs,next.config.js,server.js"
          target: "/home/optimusinfinity/adventure.madprotekcorp.com"
          strip_components: 0
          overwrite: true

      - name: Execute Remote PM2 Restart
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          script: |
            set -e

            # Detect Node.js from NVM or system paths
            if [ -s "$HOME/.nvm/nvm.sh" ]; then
              export NVM_DIR="$HOME/.nvm"
              \. "$HOME/.nvm/nvm.sh"
            fi
            export PATH="/home/optimusinfinity/.nvm/versions/node/v20.20.2/bin:$PATH:/usr/local/bin:/usr/bin:/bin"
            
            echo "==> Node version: $(node -v 2>/dev/null || echo 'not found in PATH')"
            echo "==> NPM version: $(npm -v 2>/dev/null || echo 'not found in PATH')"

            mkdir -p /home/optimusinfinity/adventure.madprotekcorp.com
            cd /home/optimusinfinity/adventure.madprotekcorp.com
            
            # Install production dependencies
            echo "==> Installing dependencies..."
            npm install --omit=dev --no-audit --no-fund || npm install --production --no-audit --no-fund || true
            
            # Ensure .env.production is configured with current production server credentials
            echo "==> Writing .env.production..."
            printf "%s\n" \
              "PORT=3001" \
              "NODE_ENV=production" \
              "MYSQL_HOST=localhost" \
              "MYSQL_PORT=3306" \
              "MYSQL_USER=optimusinfinity_mpuser" \
              "MYSQL_PASSWORD=MadProTekPass2026!#" \
              "MYSQL_DATABASE=optimusinfinity_offroad" \
              "ADMIN_SECRET_KEY=madprotek2026" \
              "NEXT_PUBLIC_APP_URL=https://adventure.madprotekcorp.com" \
              "NEXT_PUBLIC_CASHFREE_ENV=TEST" > .env.production
            
            # Detect PM2 binary
            PM2_BIN=""
            if [ -f "/home/optimusinfinity/madprotek/node_modules/pm2/bin/pm2" ]; then
              PM2_BIN="node /home/optimusinfinity/madprotek/node_modules/pm2/bin/pm2"
            elif [ -f "./node_modules/pm2/bin/pm2" ]; then
              PM2_BIN="node ./node_modules/pm2/bin/pm2"
            elif command -v pm2 >/dev/null 2>&1; then
              PM2_BIN="pm2"
            else
              npm install pm2 --no-save || true
              if [ -f "./node_modules/pm2/bin/pm2" ]; then
                PM2_BIN="node ./node_modules/pm2/bin/pm2"
              else
                PM2_BIN="npx --yes pm2"
              fi
            fi
            echo "==> Using PM2 runner: $PM2_BIN"
            
            # Start or reload with PM2 on port 3001
            $PM2_BIN startOrReload ecosystem.config.cjs --update-env || $PM2_BIN start ecosystem.config.cjs || $PM2_BIN reload adventure-offroad || true
            $PM2_BIN save || true
            
            # Ensure crontab has @reboot rule to auto-start PM2 after any server reboot
            EXISTING_CRON=$(crontab -l 2>/dev/null || true)
            if ! echo "$EXISTING_CRON" | grep -q "pm2 resurrect"; then
              (echo "$EXISTING_CRON"; echo "@reboot export PATH=\"/home/optimusinfinity/.nvm/versions/node/v20.20.2/bin:\$PATH:/usr/local/bin:/usr/bin\" && ($PM2_BIN resurrect || pm2 resurrect) >> /home/optimusinfinity/pm2_reboot.log 2>&1") | crontab - || true
              echo "==> Added PM2 @reboot crontab persistence."
            fi
            
            echo "==> PM2 Process Status:"
            $PM2_BIN status || true
            
            echo "Deployment to adventure.madprotekcorp.com completed successfully!"

