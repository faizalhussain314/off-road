name: Deploy to Production (adventure.madprotekcorp.com)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Next.js Application
        run: npm run build
        env:
          NODE_ENV: production
          NEXT_TELEMETRY_DISABLED: 1

      - name: Deploy to Server via SSH
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          source: ".next,public,package.json,package-lock.json,ecosystem.config.cjs,next.config.js,server.js"
          target: "/home/optimusinfinity/adventure.madprotekcorp.com"
          strip_components: 0
          overwrite: true

      - name: Execute Remote PM2 Restart
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          debug: true
          script_stop: false
          script: |
            export PATH="/home/optimusinfinity/.nvm/versions/node/v20.20.2/bin:$PATH:/usr/local/bin:/usr/bin:/bin"
            if [ -s "$HOME/.nvm/nvm.sh" ]; then
              export NVM_DIR="$HOME/.nvm"
              \. "$HOME/.nvm/nvm.sh" || true
            fi

            cd /home/optimusinfinity/adventure.madprotekcorp.com

            echo "==> Node: $(node -v 2>/dev/null || echo 'not found')"
            echo "==> NPM: $(npm -v 2>/dev/null || echo 'not found')"

            echo "==> Writing .env.production..."
            printf "%s\n" \
              "PORT=3001" \
              "NODE_ENV=production" \
              "MYSQL_HOST=localhost" \
              "MYSQL_PORT=3306" \
              "MYSQL_USER=optimusinfinity_mpuser" \
              "MYSQL_PASSWORD=MadProTekPass2026!#" \
              "MYSQL_DATABASE=optimusinfinity_offroad" \
              "ADMIN_SECRET_KEY=madprotek2026" \
              "NEXT_PUBLIC_APP_URL=https://adventure.madprotekcorp.com" \
              "NEXT_PUBLIC_CASHFREE_ENV=TEST" > .env.production

            echo "==> Installing dependencies..."
            npm install --omit=dev --no-audit --no-fund || true

            echo "==> Reloading PM2 process..."
            if [ -f "/home/optimusinfinity/madprotek/node_modules/pm2/bin/pm2" ]; then
              node /home/optimusinfinity/madprotek/node_modules/pm2/bin/pm2 startOrReload ecosystem.config.cjs --update-env || node /home/optimusinfinity/madprotek/node_modules/pm2/bin/pm2 start ecosystem.config.cjs || true
              node /home/optimusinfinity/madprotek/node_modules/pm2/bin/pm2 save || true
            elif command -v pm2 >/dev/null 2>&1; then
              pm2 startOrReload ecosystem.config.cjs --update-env || pm2 start ecosystem.config.cjs || true
              pm2 save || true
            else
              npx pm2 startOrReload ecosystem.config.cjs --update-env || npx pm2 start ecosystem.config.cjs || true
              npx pm2 save || true
            fi

            echo "Deployment to adventure.madprotekcorp.com completed successfully!"

