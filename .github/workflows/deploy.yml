name: Deploy to Production (adventure.madprotekcorp.com)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Next.js Application
        run: npm run build
        env:
          NODE_ENV: production
          NEXT_TELEMETRY_DISABLED: 1

      - name: Deploy to Server via SSH
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          source: ".next,public,package.json,package-lock.json,ecosystem.config.cjs,next.config.js"
          target: "/home/optimusinfinity/adventure.madprotekcorp.com"
          strip_components: 0
          overwrite: true

      - name: Execute Remote PM2 Restart
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          script: |
            export PATH="/home/optimusinfinity/.nvm/versions/node/v20.20.2/bin:$PATH"
            cd /home/optimusinfinity/adventure.madprotekcorp.com
            
            # Install production dependencies if missing
            npm install --omit=dev --no-audit --no-fund
            
            # Ensure .env.production is configured with current production server credentials
            printf "%s\n" \
              "PORT=3001" \
              "NODE_ENV=production" \
              "MYSQL_HOST=localhost" \
              "MYSQL_PORT=3306" \
              "MYSQL_USER=optimusinfinity_mpuser" \
              "MYSQL_PASSWORD=MadProTekPass2026!#" \
              "MYSQL_DATABASE=optimusinfinity_offroad" \
              "ADMIN_SECRET_KEY=madprotek2026" \
              "NEXT_PUBLIC_APP_URL=https://adventure.madprotekcorp.com" \
              "NEXT_PUBLIC_CASHFREE_ENV=TEST" > .env.production
            
            # Start or reload with PM2 on port 3001
            node /home/optimusinfinity/madprotek/node_modules/pm2/bin/pm2 startOrReload ecosystem.config.cjs --update-env
            node /home/optimusinfinity/madprotek/node_modules/pm2/bin/pm2 save
            
            # Ensure crontab has @reboot rule to auto-start PM2 after any server reboot
            if ! crontab -l 2>/dev/null | grep -q "pm2 resurrect"; then
              (crontab -l 2>/dev/null; echo "@reboot export PATH=\"/home/optimusinfinity/.nvm/versions/node/v20.20.2/bin:\$PATH\" && node /home/optimusinfinity/madprotek/node_modules/pm2/bin/pm2 resurrect >> /home/optimusinfinity/pm2_reboot.log 2>&1") | crontab -
              echo "Added PM2 @reboot crontab persistence."
            fi
            
            echo "Deployment to adventure.madprotekcorp.com completed successfully!"

